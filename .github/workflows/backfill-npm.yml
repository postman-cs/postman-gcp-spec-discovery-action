name: Backfill npm

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Ordered space-separated immutable tags, oldest first
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish immutable release assets to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; fi
          PACKAGE_NAME='@postman-cs/onboarding-gcp-spec-discovery'
          for TAG in ${{ inputs.tags }}; do
            TAG_DIR="$(mktemp -d)"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'release.tgz' --dir "$TAG_DIR"
            TARBALL="$TAG_DIR/release.tgz"
            test -f "$TARBALL"
            PACKAGE_JSON="$(tar -xOf "$TARBALL" package/package.json)"
            ACTUAL_NAME="$(printf '%s' "$PACKAGE_JSON" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(d).name))')"
            ACTUAL_VERSION="$(printf '%s' "$PACKAGE_JSON" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(d).version))')"
            test "$ACTUAL_NAME" = "$PACKAGE_NAME"
            test "$ACTUAL_VERSION" = "${TAG#v}"
            if npm view "${PACKAGE_NAME}@${ACTUAL_VERSION}" version >/dev/null 2>&1; then
              echo "::notice::${PACKAGE_NAME}@${ACTUAL_VERSION} already exists; skipping"
            else
              npm publish "$TARBALL" --provenance --access public --tag backfill
            fi
          done
          HIGHEST_VERSION="$(npm view "$PACKAGE_NAME" versions --json | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const versions=JSON.parse(d);const compare=(a,b)=>{const x=a.split(".").map(Number),y=b.split(".").map(Number);for(let i=0;i<3;i+=1){if(x[i]!==y[i])return x[i]-y[i]}return 0};process.stdout.write((Array.isArray(versions)?versions:[versions]).sort(compare).at(-1)||"")})')"
          test -n "$HIGHEST_VERSION"
          npm dist-tag add "${PACKAGE_NAME}@${HIGHEST_VERSION}" latest
